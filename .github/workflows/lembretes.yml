name: Lembretes diários

on:
  schedule:
    # Horários em UTC (Brasília + 3 h), disparados 3 min antes para compensar a fila do GitHub
    # Rotina de nov/2026 — o script push/enviar.js sabe qual aviso é cada linha
    - cron: "27 5 * * *"      # 02h30 ativação
    - cron: "52 5 * * *"      # 02h55 estudo principal
    - cron: "27 8 * * *"      # 05h30 treino (ter, qui, dom) ou estudo extra (seg, qua, sex, sáb)
    - cron: "57 12 * * *"     # 10h00 água
    - cron: "57 14 * * *"     # 12h00 almoço e suplementos
    - cron: "57 16 * * 0,6"   # 14h00 simulado (sáb) / estudo da tarde (dom)
    - cron: "57 20 * * *"     # 18h00 Caderno de Erros e véspera (dom: revisão da semana)
    - cron: "57 21 * * *"     # 19h00 fechar o dia
  workflow_dispatch:
    inputs:
      slot:
        description: "Aviso para testar: acordar, estudo, treino, questoes, agua, almoco, tarde, revisao, semanal ou fechar"
        required: false
        default: "fechar"

permissions:
  contents: write

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund web-push@3.6.7
      - name: Enviar aviso
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SLOT: ${{ github.event.inputs.slot }}
          CRON: ${{ github.event.schedule }}
        run: node push/enviar.js
      - name: Manter o agendamento ativo
        if: github.event_name == 'schedule'
        run: |
          # O GitHub pausa agendamentos de repositórios sem atividade por 60 dias.
          # Um registro por semana, no domingo à noite (aviso das 19h), evita a pausa.
          if [ "$(TZ=America/Sao_Paulo date +%u)" = "7" ] && [ "$(TZ=America/Sao_Paulo date +%H)" -ge 18 ]; then
            date -u +%FT%TZ > push/ultimo-envio.txt
            git config user.name "lembretes-100dias"
            git config user.email "lembretes@users.noreply.github.com"
            git add push/ultimo-envio.txt
            git commit -m "Registro semanal dos lembretes" && git push || true
          fi
